<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MindAR 平面影像與文字解說示範</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    /* 隱藏滾動條，讓 AR 視圖全螢幕顯示 */
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 解說文字面板的樣式 */
    #info-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 400px;
      background: rgba(20, 20, 20, 0.85); /* 半透明黑底 */
      color: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 1000;
      display: none; /* 初始隱藏，掃描到才顯示 */
      text-align: left;
      backdrop-filter: blur(5px);
    }
    #info-panel h3 {
      margin: 0 0 10px 0;
      color: #4CAF50;
      font-size: 20px;
    }
    #info-panel p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #E0E0E0;
    }
  </style>

  <script>
    // 互動縮放與旋轉腳本
    AFRAME.registerComponent('touch-transform', {
      init: function () {
        const el = this.el;
        this.defaultScale = el.object3D.scale.x;
        this.currentScale = this.defaultScale;
        this.prevDistance = null;
        this.prevAngle = null;

        const canvas = el.sceneEl.canvas;
        let lastTapTime = 0;

        canvas.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            const currentTime = Date.now();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 300 && tapLength > 0) {
              el.object3D.scale.set(this.defaultScale, this.defaultScale, this.defaultScale);
              el.object3D.rotation.set(0, 0, 0);
              this.currentScale = this.defaultScale;
              e.preventDefault();
            }
            lastTapTime = currentTime;
          }

          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            this.prevDistance = Math.hypot(dx, dy);
            this.prevAngle = Math.atan2(dy, dx);
          }
        });

        canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && this.prevDistance !== null) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);

            const scaleFactor = dist / this.prevDistance;
            this.currentScale *= scaleFactor;
            this.currentScale = Math.min(Math.max(this.currentScale, 0.5), 3);
            el.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);

            const deltaAngle = angle - this.prevAngle;
            const rot = el.object3D.rotation;
            el.object3D.rotation.set(rot.x, rot.y, rot.z + deltaAngle);

            this.prevDistance = dist;
            this.prevAngle = angle;
            e.preventDefault();
          }
        });

        canvas.addEventListener('touchend', (e) => {
          if (e.touches.length < 2) {
            this.prevDistance = null;
            this.prevAngle = null;
          }
        });
      }
    });

    // 偵測掃描狀態以顯示/隱藏文字
    document.addEventListener("DOMContentLoaded", function() {
      const target = document.querySelector('#target-entity');
      const infoPanel = document.querySelector('#info-panel');

      // 當攝影機捕捉到辨識圖時
      target.addEventListener("targetFound", event => {
        infoPanel.style.display = "block";
      });

      // 當辨識圖離開畫面時
      target.addEventListener("targetLost", event => {
        infoPanel.style.display = "none";
      });
    });
  </script>
</head>
<body>

<div id="info-panel">
  <h3>🖼️ 影像介紹</h3>
  <p>這是一張會跳出解說文字的平面影像！<br>
    💡 <b>操作提示：</b><br>
    • 單指雙擊：重置大小與角度<br>
    • 雙指捏合：放大與縮小影像<br>
    • 雙指旋轉：旋轉影像方向
  </p>
</div>

<a-scene
        mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: true; uiError: true; uiScanning: true;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <img id="resultImg" src="card1.jpeg" />
  </a-assets>

  <a-light type="ambient" intensity="3"></a-light>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
    <a-plane
            src="#resultImg"
            width="1.2"
            height="0.7"
            position="0 0 0"
            touch-transform
    ></a-plane>
  </a-entity>
</a-scene>
</body>
</html>
