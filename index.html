<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <title>AR 植物探索小尖兵</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="margin: 0; overflow: hidden">
    
    <div id="ui-container">
      <h1 id="plant-name">請掃描圖卡</h1>
      <p id="plant-desc">找找看植物在哪裡呢？</p>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: assets/models/makers/targets.mind;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="Tree1-model" src="assets/models/Tree1.glb"></a-asset-item>
        <a-asset-item id="cactus-model" src="assets/models/cactus.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-tree">
        <a-entity
          gltf-model="#Tree1-model"
          scale="0.5 0.5 0.5"
          position="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"
        >
        </a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-cactus">
        <a-entity
          gltf-model="#cactus-model"
          scale="0.5 0.5 0.5"
          position="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"
        >
        </a-entity>
      </a-entity>

    </a-scene>

    <script src="app.js"></script>
  </body>
</html>
